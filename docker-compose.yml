# Ambiente de desenvolvimento local.
# Subir:  docker compose up -d --build
# Acesso: http://localhost:8000
name: lara-dev

x-app: &app
  build: .
  image: lara-cosmeticos:dev
  working_dir: /var/www
  volumes:
    - ./:/var/www
  env_file: .env
  environment:
    PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
    DB_HOST: db
    REDIS_HOST: redis
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  networks: [lara]

services:
  app:
    <<: *app
    environment:
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
      DB_HOST: db
      REDIS_HOST: redis
      RUN_MIGRATIONS: "true"

  queue:
    <<: *app
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [lara]

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lara}
      MYSQL_USER: ${DB_USERNAME:-lara}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lara}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: --default-time-zone=-04:00 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lara]

  redis:
    image: redis:7-alpine
    networks: [lara]

  # Vite com hot reload: docker compose --profile front up node
  node:
    image: node:20-alpine
    profiles: [front]
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    networks: [lara]

networks:
  lara:

volumes:
  dbdata:
